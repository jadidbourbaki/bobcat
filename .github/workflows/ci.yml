name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# CI runs `just check`, the same gate contributors run locally. Change
# the checks in the justfile, not here.

jobs:
  check:
    name: Check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the check tools
        run: |
          brew install just clang-format
          cargo install --locked cargo-sort
      # `just check` runs ruff and ty over the Python tools through uv.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      # The tests that need a model file or a Metal device print `skip:`
      # and pass when the runner lacks them.
      - name: Check
        run: just check
