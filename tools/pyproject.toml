[project]
name = "gip-tools"
version = "0.1.0"
description = "Reference dumps and benchmark scripts for gip"
requires-python = ">=3.12"
dependencies = [
    "mlx==0.32.2",
    "mlx-lm==0.31.3",
    "numpy==2.5.3",
    "torch==2.14.0",
    "transformers==5.17.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "ty==0.0.84",
]

[tool.uv]
package = false
