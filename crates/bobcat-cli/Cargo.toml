[package]
name = "bobcat-cli"
description = "The bobcat command, which chats with a model on the Metal GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "bobcat"
path = "src/main.rs"
# The binary shares its name with the library, whose documentation takes the path.
doc = false

[dependencies]
bobcat = { workspace = true }
bobcat-gguf = { workspace = true }
clap = { workspace = true }
fastrand = { workspace = true }
hf-hub = { workspace = true }
minijinja = { workspace = true }
minijinja-contrib = { workspace = true }
rustyline = { workspace = true }
tokenizers = { workspace = true }

[lints]
workspace = true
